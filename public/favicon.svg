<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07152f"/>
      <stop offset="55%" stop-color="#102b5c"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1a8"/>
      <stop offset="35%" stop-color="#dcae38"/>
      <stop offset="70%" stop-color="#fff0a0"/>
      <stop offset="100%" stop-color="#b57a18"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162e5c"/>
      <stop offset="50%" stop-color="#0a1b3b"/>
      <stop offset="100%" stop-color="#020b1d"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="18"
        flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- خلفية الأيقونة -->
  <rect
    x="10"
    y="10"
    width="492"
    height="492"
    rx="105"
    fill="url(#bg)"
  />

  <!-- الإطار الذهبي -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="100"
    fill="none"
    stroke="url(#gold)"
    stroke-width="8"
  />

  <!-- البطاقة -->
  <g transform="rotate(-8 256 256)" filter="url(#shadow)">

    <rect
      x="65"
      y="150"
      width="382"
      height="235"
      rx="35"
      fill="url(#card)"
      stroke="#31558f"
      stroke-width="2"
    />

    <!-- شريط ذهبي -->
    <path
      d="M65 315
         C165 270 270 285 447 215
         L447 270
         C285 335 175 320 65 365 Z"
      fill="url(#gold)"
      opacity="0.95"
    />

    <!-- الشريحة -->
    <rect
      x="105"
      y="215"
      width="62"
      height="48"
      rx="9"
      fill="url(#gold)"
    />

    <path
      d="M125 215v48
         M147 215v48
         M105 239h62"
      stroke="#8b641c"
      stroke-width="3"
      opacity="0.7"
    />

    <!-- رمز الدفع اللاتلامسي -->
    <path
      d="M183 218
         Q210 239 183 260
         M195 210
         Q235 239 195 268
         M207 202
         Q260 239 207 276"
      fill="none"
      stroke="url(#gold)"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- VISA -->
    <text
      x="335"
      y="205"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="55"
      font-weight="900"
      font-style="italic"
      fill="url(#gold)">
      VISA
    </text>

    <!-- رقم البطاقة -->
    <text
      x="102"
      y="302"
      font-family="Arial, Helvetica, sans-serif"
      font-size="23"
      font-weight="600"
      letter-spacing="4"
      fill="#f5f7ff">
      4000 1234 5678
    </text>

    <!-- VALID -->
    <text
      x="104"
      y="340"
      font-family="Arial, Helvetica, sans-serif"
      font-size="10"
      fill="#b9c7e3">
      VIRTUAL CARD
    </text>

  </g>

  <!-- وهج بسيط -->
  <circle
    cx="420"
    cy="90"
    r="4"
    fill="#ffffff"
    opacity="0.9"
  />

  <circle
    cx="390"
    cy="115"
    r="2"
    fill="#ffffff"
    opacity="0.6"
  />

</svg>